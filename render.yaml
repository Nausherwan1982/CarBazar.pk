services:
  - type: web
    name: carbazar-pk
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: carbazar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_DEMO
        value: "false"

databases:
  - name: carbazar-db
    databaseName: carbazar
    user: carbazar
    region: singapore
    plan: basic-256mb
